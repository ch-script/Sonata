# System Packages (nixpkgs)
# -----------------------------------------------------------------------------
[pkg] # WE ARE DECLARATIVE NOW!!!!!!

setup_declaration = { cmd = "bash ~/.config/snt/scripts/os/nixos/setup.sh", confirm = "yesorno", msg = "This will modify your configuration.nix to import packages.nix. Proceed?" }

declare = "bash ~/.config/snt/scripts/os/nixos/install.sh {1}"

undeclare = "bash ~/.config/snt/scripts/os/nixos/remove.sh {1}"

update = "sudo nixos-rebuild switch --upgrade"

install = "nix-env -iA nixos.{1}"

remove = "nix-env -e {1}"

search = "nix-env -qaP {1}"
